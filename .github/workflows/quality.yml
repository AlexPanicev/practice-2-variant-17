name: Coursework checks
on: [push, pull_request, workflow_dispatch]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_quality.py
      - run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          for script in run.sh scripts/*.sh; do
            [ -f "$script" ] || continue
            sh -n "$script" || exit 1
          done
      - name: Render local fixtures with D2 0.9.0
        run: |
          set -eu
          archive="$RUNNER_TEMP/d2-linux-amd64.tar.gz"
          url=https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz
          digest=5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
          curl -fsSL --retry 3 "$url" -o "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/d2-v0.9.0/bin:$PATH"
          d2 version
          ./scripts/05-demo.sh test
          for name in chain diamond cycle self isolated filter; do
            test -s "output/$name.d2"
            test -s "output/$name.png"
          done
